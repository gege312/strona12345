<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Logowanie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 40px;
      text-align: center;
    }
    form {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    input[type="text"],
    input[type="password"] {
      padding: 12px;
      width: 250px;
      font-size: 18px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Zaloguj się</h2>

  <form onsubmit="zaloguj(); return false;">
    <div>
      <input type="text" id="login" placeholder="Login" required><br>
      <input type="password" id="haslo" placeholder="Hasło" required><br>
      <input type="checkbox" onclick="pokazHaslo()"> Pokaż hasło<br><br>
      <button type="submit">Zaloguj</button>
    </div>
  </form>

  <p id="komunikat"></p>

  <script>
    function pokazHaslo() {
      const haslo = document.getElementById("haslo");
      haslo.type = haslo.type === "password" ? "text" : "password";
    }

    function zaloguj() {
      const login = document.getElementById("login").value;
      const haslo = document.getElementById("haslo").value;

      // Tutaj symulujemy, że "dostajesz dane"
      console.log("Login:", login);
      console.log("Hasło:", haslo);

      document.getElementById("komunikat").innerText =
        "Zalogowano jako: " + login + "\n(Hasło: " + haslo + ")";
    }
  </script>

</body>
</html>
